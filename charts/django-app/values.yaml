replicaCount: 2

image:
  # Підстав URL свого ECR-репозиторію (вивід `terraform output ecr_repository_url`
  # у lesson-7), напр. "123456789012.dkr.ecr.us-west-2.amazonaws.com/lesson-7-django-app"
  repository: 430383499929.dkr.ecr.us-west-2.amazonaws.com/lesson-7-django-app
  tag: 3-a1d2849
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Змінні середовища, перенесені з теми 4 (.env / docker-compose.yml).
# Прокидаються в контейнер через ConfigMap + envFrom.
# ⚠️ Для навчального завдання секрети (пароль БД, SECRET_KEY) також лежать тут,
# як цього вимагає завдання. У реальному проєкті DJANGO_SECRET_KEY та
# POSTGRES_PASSWORD варто виносити в Kubernetes Secret, а не ConfigMap.
env:
  DJANGO_SECRET_KEY: "change-me-to-a-random-secret-key"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  POSTGRES_DB: "django_app"
  POSTGRES_USER: "app_admin"
  POSTGRES_PASSWORD: "xAi0JIs03F)|V>x.W8YqV-smSaaT"
  # Реальний RDS endpoint/порт підставляє Terraform (django_app.tf) з
  # виводів module.rds — вручну редагувати values.yaml не потрібно, він
  # перегенеровується при кожному `terraform apply`.
  POSTGRES_HOST: "lesson-7-django-db.cvkakcwwgosp.us-west-2.rds.amazonaws.com"
  POSTGRES_PORT: "5432"

# Бонусне завдання: Ingress + TLS через cert-manager. Вимкнено за замовчуванням.
ingress:
  enabled: false
  className: nginx
  host: yourdomain.com
  path: /
  pathType: Prefix
  tls: true
  clusterIssuer: letsencrypt-prod
